<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora de Porcentaje de Grasa Corporal</title>
    <link rel="icon" href="../img/olympo.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/bodyfat.css">   
</head>
<body>
    <div class="header-image"></div>
    <div class="container">
        <header>
            <h1>Calculadora de Porcentaje de Grasa Corporal</h1>
            <p>Monitorea tu porcentaje de grasa corporal con la formula del Departamento de defensa de EE.UU</p>
        </header>
        
        <section class="form-section">
            <form id="bodyFatform">
                <label for="waist">Circunferencia de la cintura (cm):</label>
                <input type="number" id="waist" name="waist" required placeholder="Ej: 85">

                <label for="neck">Circunferencia del cuello (cm):</label>
                <input type="number" id="neck" name="neck" required placeholder="Ej: 40">

                <label for="height">Altura (cm):</label>
                <input type="number" id="height" name="height" required placeholder="Ej: 175">

                <label for="gender">Género</label>
                <select name="gender" id="gender" required>
                    <option value="" disabled selected>Selecciona tu género</option>
                    <option value="male">Hombre</option>
                    <option value="female">Mujer</option>
                </select>
                <div id="female-inputs" style="display: none;">
                    <label for="hip">Circunferencia de la cadera (cm):</label>
                    <input type="number" id="hip" name="hip" placeholder="Ej: 95">
                </div>
                <button type="submit" class="btn-submit">Calcular</button>
            </form>
        </section>
        
        <section class="result-section">
            <div id="result" class="result-box">

            </div>
        </section>
    </div>
    
    <script src="../js/bodyfat.js"></script>
    <footer>
    <p>&copy; 2024 DeathCode Studios. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
